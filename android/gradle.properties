# Memory settings - need enough heap for release build (1GB was causing OOM)
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dfile.encoding=UTF-8
android.useAndroidX=true

# Build performance defaults for local iteration
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.workers.max=4

# Build cache for faster subsequent builds
org.gradle.buildCache=true

# Network timeouts and retries (helps with slow/unreliable connections)
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# Android build optimizations
android.enableJetifier=true
android.enableR8.fullMode=true
